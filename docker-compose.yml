version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - RANK_ADMIN_KEY=${RANK_ADMIN_KEY:-}
      - SESSION_VIDEO_DIR=/app/public/Video
    volumes:
      - json_data:/app/data
      - ./frontend/public/Video:/app/public/Video:ro
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  json_data:
